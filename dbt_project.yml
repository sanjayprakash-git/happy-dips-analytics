name: happy_dips
version: "1.0.0"
config-version: 2
profile: happy_dips

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

models:
  happy_dips:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
      finance:
        +schema: finance
      growth:
        +schema: growth

seeds:
  happy_dips:
    +schema: reference
